apiVersion: apps/v1
kind: Deployment


metadata:
  name: nodejs-app


spec:
  replicas: 2

  selector: 
    matchLabels:
      app: nodejs-app


  template:
    metadata:
      labels: 
       app: nodejs-app


    spec:
      containers: 
      - name: nodejs-container
        image: anusha987/nodejs-demo:v1


        ports:
        - containerPort: 3000
        
         


